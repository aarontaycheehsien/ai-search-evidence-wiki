notes: >
  Evaluated a multi-stage PICO and terminology-to-Boolean pipeline on 81
  PubMed-indexed LEADSInstruct reviews. The authors report average recall of
  0.87 for their full pipeline versus 0.10 for direct GPT-4o prompting, but
  precision and screening workload were not reported. Reviews returning over
  1,000 citations or API errors were excluded, limiting interpretation.
