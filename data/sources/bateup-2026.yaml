notes: >
  Compared eight deduplication tools against dual-reviewer gold standards from
  five rerun Cochrane searches. Across 22,778 records, false removal of unique
  records ranged from 2 to 22, retained duplicates from 34 to 280, and total
  processing time from 42 seconds to 20 hours 34 minutes. No tool was best on
  every outcome; the sample was limited to five biomedical review datasets.
