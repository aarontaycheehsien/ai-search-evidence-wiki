notes: >
  Compared Elicit with a completed dermatology systematic review containing 24
  randomized trials. Elicit's 59-result concept search recovered one included
  trial, while its 27-result keyword search recovered none. In extraction,
  disease was correct for all 24 trials, but study country and derived Jadad
  scores were wrong in 5 of 24 cases each. The authors found raw extraction
  faster but reported that cross-checking and custom-column setup could erase
  the time gain. This was one narrow review using one evolving product.
