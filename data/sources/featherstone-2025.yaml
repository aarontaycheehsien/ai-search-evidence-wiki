notes: >
  Retrospectively compared Lens.org, SpiderCite, and Microsoft Copilot with
  customary information-specialist searches across seven health-technology
  assessment projects, followed by a focus group with seven information
  specialists. Average sensitivity across six review projects was 0.676 for
  Lens.org, 0.230-0.257 for the two SpiderCite directions, and 0.244 for
  Copilot, versus 0.986 for the reference searches. Test searches took less
  execution and modeled screening time, but their suitability varied by task.
  Searchers knew the target studies, the project sample was small, and tools
  were not evaluated in combination.
