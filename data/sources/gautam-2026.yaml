  Qualitative think-aloud study of 15 researchers using Research Rabbit, Elicit and preferred LLM tools. Nine raised retrieval/source opacity concerns and eight used redundant manual verification. No precision, recall or measured task-time benchmark. The available PDF is the preprint manuscript associated with the conference record; tools and guided tasks reflect a point-in-time sample.
