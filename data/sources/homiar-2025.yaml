notes: >
  One living review on prodopaminergic interventions for anhedonia. Prompts
  were developed on 1,045 baseline records, then evaluated on remaining
  baseline records and two updates. Table 3 distinguishes title/abstract
  decisions from studies ultimately included after full-text review. Reported
  workload reductions are simulated; the authors did not measure prospective
  staff time for the LLM-assisted workflow.
