notes: >
  Retrospective evaluation using 23 Cochrane reviews. Prompt selection used a
  balanced 800-record development sample; performance was then assessed on
  119,695 search-result records. The authors report very low precision in the
  comprehensive set and a sensitivity-workload tradeoff across ensemble rules.
  Workload reductions are calculated from the retrospective screening data,
  not measured staff time in a prospective review.
