title: "Data Extractions Using a Large Language Model (Elicit) and Human Reviewers in Randomized Controlled Trials: A Systematic Comparison"
authors:
  - Joleen Bianchi
  - Julian Hirt
  - Magdalena Vogt
  - Janine Vetsch
year: 2025
doi: 10.1002/cesm.70033
url: https://doi.org/10.1002/cesm.70033
publication_status: "Published in Cochrane Evidence Synthesis and Methods 3:e70033"
source_category: peer-reviewed-study
local_file: "incoming/papers/Bianchi et al - 2025 - Elicit and human RCT data extraction.pdf"
notes: >
  Compared Elicit with checked human extractions for seven fields across 20
  randomized trials (140 field-level comparisons). Elicit provided more
  correct information in 29.3%, equivalent information in 20.7%, incomplete
  information in 45.7%, and incorrect information in 4.3%. Completeness was
  weakest for intervention descriptions and effects. The convenience sample
  was small, the reference summaries were in German, and five papers contained
  relevant information in visual elements Elicit could not extract.
