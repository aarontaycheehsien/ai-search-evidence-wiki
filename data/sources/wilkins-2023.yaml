notes: >
  GPTscreenR validation screened 1,147 records from six scoping reviews.
  Consensus human title/abstract decisions were the reference standard.
  The chain-of-thought workflow had 71% weighted sensitivity, 89% weighted
  specificity, and 84% accuracy; a zero-shot comparator was similar. This
  is a preprint and its scoping-review setting may differ from other reviews.
