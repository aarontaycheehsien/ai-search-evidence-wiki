notes: >
  Audited 333 citation-claim pairs in 12 ChatGPT-5-generated mental-health
  literature reviews. Every reference mapped to a real publication, yet only
  43.5% of claims were fully accurate; 19.8% were fabricated or contradictory
  and 18.3% had major inaccuracies. The study used one model, one prompt, and
  one domain, so rates should not be generalized to all systems or topics.
