publication_status: "Published in Journal of Electronic Resources in Medical Libraries 22(3), 133-138"
source_category: peer-reviewed-study
local_file: "incoming/papers/Patterson et al - 2025 - AI research tool rating rubric.pdf"
notes: >
  Rubric-based assessment of 15 tools by a librarian and one or two student
  raters across discovery, search, and reviews. Undermind and paid Elicit were
  top-rated overall, but average interrater agreement was 21.1% and agreement
  for Undermind was 54%; this is a small subjective usability/rubric study, not
  a retrieval benchmark.
