local_file: "incoming/papers/Nykvist et al - 2025 - Testing the utility of GPT.pdf"
notes: >
  Retrospective evaluation of one environmental review with 11,984 records.
  Three GPT versions were tested with one prompt and relevance-probability
  thresholds. Table 1 reports GPT-4-1106 recall of 1.00 at thresholds through
  0.6 and lower recall at higher thresholds. Work saved is a modeled screening
  count, not observed reviewer time; generalizability beyond this review is
  untested.
