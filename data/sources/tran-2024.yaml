notes: >
  Retrospective diagnostic accuracy study across five systematic reviews and
  22,665 citations. Tables 2 and 3 distinguish balanced and sensitivity-
  optimized rules. Table 3 reports full-text inclusions missed by trimming
  as 1/26, 0/8, 1/200, 0/29, and 11/445 across the five reviews. The abstract
  and discussion summarize a smaller maximum (0 to 1 of 26), which does not
  match the 11/445 table entry. Claim records use Table 3 and flag this
  discrepancy rather than silently reconciling it.
