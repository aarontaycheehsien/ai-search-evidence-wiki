notes: >
  Evaluated a retrieval-augmented extraction pipeline on 10 papers and 150
  categorical data points from a digital-health systematic review. Against a
  human-consensus comparison, aggregate precision/recall were 0.820/0.820 for
  DeepSeek V3.1, 0.846/0.813 for Qwen2.5 72B, and 0.624/0.564 for Qwen2.5 7B.
  The evaluation subset was small and text-only parsing missed table/figure
  content; the paper reports no extraction-time benchmark.
