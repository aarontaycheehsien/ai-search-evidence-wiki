id: reed-2024-search
type: journal-article
title: "Assessing the Quality of Biomedical Boolean Search Strings Generated by Prompted and Unprompted Models Using ChatGPT: A Pilot Study"
authors:
  - Robyn B. Reed
  - Derek J. Barnett
year: 2024
doi: 10.1080/02763869.2024.2440848
url: https://doi.org/10.1080/02763869.2024.2440848
publication_status: "Published in Medical Reference Services Quarterly 44(1), 31-40"
source_category: peer-reviewed-study
local_file: "incoming/papers/Reed and Barnett - 2024 - ChatGPT Boolean search quality pilot.pdf"
notes: >
  Pilot study using four review topics, three ChatGPT-based systems, and five
  runs per topic. Mean recall was 6.9%-9.4% and mean precision 28.2%-35.3% when
  compared with published PubMed searches; outputs varied substantially between
  runs and sometimes required syntax cleanup. Published search strategies are
  imperfect reference standards and only four reviews were tested.
