notes: >
  Applied five gold-validated verifiers to identical claim-citation pairs from
  agentic scientific-synthesis outputs. The measured unsupported-citation rate
  ranged from about 3% to about 18% as verifier strictness changed. On 300
  cited sentences, verifiers agreed strongly on supported citations but only
  weakly on which citations to flag (negative-specific agreement 0.27-0.30).
  The study concerns multi-paper cited answers and is a preprint; it also shows
  that verifier-dependent rates should not be compared without a shared
  protocol.
