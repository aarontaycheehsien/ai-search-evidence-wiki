title: "A critical evaluation of generative query expansion on biomedical literature retrieval"
authors:
  - Yilu Fang
  - Gongbo Zhang
  - Fangyi Chen
  - Yifan Peng
  - Chunhua Weng
year: 2026
doi: 10.1093/jamia/ocag037
url: https://doi.org/10.1093/jamia/ocag037
publication_status: "Published in Journal of the American Medical Informatics Association 33(6), 1121-1133"
source_category: peer-reviewed-study
local_file: "incoming/papers/Fang et al - 2026 - Critical evaluation of generative query expansion.pdf"
notes: >
  Benchmarked eight generative query-expansion methods with three LLMs across
  five biomedical retrieval datasets and a roughly 36-million-record PubMed
  corpus. Expansion sometimes improved TREC Precision Medicine retrieval but
  often reduced BioASQ and PubMedQA performance. Effects depended more on the
  expansion method and evidence type than on the backbone model, and largely
  changed ranking rather than screening coverage.
