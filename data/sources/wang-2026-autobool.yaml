notes: >
  Reinforcement-learned Qwen3 Boolean queries were evaluated on a 1,000-topic
  post-training PubMed benchmark plus CLEF TAR and Seed collections. On CLEF TAR,
  AutoBool recall was 0.8387 versus 0.8458 for expert queries, while retrieving
  818 versus 14,327 documents. On the Seed Collection recall was 0.6828 versus
  0.7241. Results are benchmark-specific; precision remained low and training
  used PMC open-access systematic reviews.
