notes: >
  Evaluated the specialized LEADS model across literature-mining tasks and in a
  workflow pilot. In the data-extraction pilot, two researchers processed 90
  clinical-trial publications; the expert-plus-LEADS arm had accuracy 0.85
  versus 0.80 for expert-only and took 83.3 versus 113.9 seconds per task
  (26.9% less time). The pilot was small; model outputs still required expert
  checking, and results depend on the paper's curated training and evaluation
  data.
