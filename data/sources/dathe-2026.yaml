notes: >
  Evaluated five document-question-answering tools and five literature-review
  tools. For one research question with a 38-paper reference set, two repeated
  runs had low source overlap: Jaccard values were 28.0% for Consensus, 25.0%
  for ChatGPT, 17.6% for You.com, and 11.8% for Perplexity. Fourteen of 50
  Consensus sources met the study's usable-source definition. Source-highlighting
  accuracy for document tools scored only 1-3 on a five-point scale. The study
  used one literature question, one rater per tool, and is a preprint.
