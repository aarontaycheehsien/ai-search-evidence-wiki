local_file: "incoming/papers/Li et al - 2025 - ReportBench academic survey tasks.pdf"
notes: >
  ReportBench sampled 100 prompts from a corpus of 678 post-2020 academic
  survey papers. A GPT-4o-based pipeline extracted cited statements and judged
  semantic consistency with retrieved source documents. Match rates ranged
  from 31.43% to 78.87% across six systems. Because source support was scored
  by an automated judge and the paper is a preprint, the estimates require
  independent human validation.
