source_category: peer-reviewed-study
local_file: "incoming/papers/Lau and Golder - 2025 - Elicit vs traditional search.pdf"
notes: >
  Retrospective comparison of Elicit Pro in Review mode with four completed
  evidence syntheses. The abstract reports mean sensitivity of 39.5% for Elicit
  versus 94.5% for original searches and mean precision of 41.8% versus 7.55%.
  The study also found additional eligible studies, but results depend on four
  review topics, product version, and retrospectively reconstructed searches.
  Full-text Methods (PDF pp. 2-3) show a combined workflow: retrieval of
  500 candidates followed by automated screening using manually adjusted
  criteria. Table 1 (p. 6) precision denominators are Elicit-included records,
  not all 500 candidates; sensitivity denominators include newly eligible
  records identified by Elicit. These estimates are therefore not isolated
  retrieval-stage performance. Results (pp. 4-6) distinguish records not
  retrieved from eligible records retrieved but excluded at screening.
