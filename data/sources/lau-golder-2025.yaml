title: "Comparison of Elicit AI and Traditional Literature Searching in Evidence Syntheses Using Four Case Studies"
authors:
  - Oscar Lau
  - Su Golder
year: 2025
doi: 10.1002/cesm.70050
url: https://doi.org/10.1002/cesm.70050
publication_status: "Published in Cochrane Evidence Synthesis and Methods"
source_category: peer-reviewed-study
local_file: "incoming/papers/Lau and Golder - 2025 - Elicit vs traditional search.pdf"
notes: >
  Retrospective comparison of Elicit Pro in Review mode with four completed
  evidence syntheses. The abstract reports mean sensitivity of 39.5% for Elicit
  versus 94.5% for original searches and mean precision of 41.8% versus 7.55%.
  The study also found additional eligible studies, but results depend on four
  review topics, product version, and retrospectively reconstructed searches.
