  Six models evaluated on title/abstract screening using two review-derived target sets (periodontal regeneration and bronchoscopy). Pools were stratified by semantic similarity, sampled and target articles inserted into each subset. GPT-4o achieved high recall, while precision declined in the most similar quartile; weaker models either missed targets or accepted everything. Synthetic target-enriched subsets, small domain-specific target sets, and no end-to-end timing limit generalization. The reported subset size and confusion-count totals appear inconsistent; avoid derived pooled denominators.
