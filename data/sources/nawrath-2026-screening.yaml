notes: >
  Abstract-based record. Retrospective validation of five LLMs on a 500-record
  environmental-science dataset with eight inclusions (1.6% prevalence). The
  abstract reports no false negatives for Gemini 2.0 Flash and Mistral Large,
  while DeepSeek V3 had the highest specificity and accuracy but 0.375
  sensitivity. Metrics of agreement differed under low prevalence. Full-text
  methods and tables have not been independently checked for this wiki record.
