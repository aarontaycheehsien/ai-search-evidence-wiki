  107 trials from 12 Cochrane reviews, mainly Chinese-language complementary-medicine trials. Moonshot-v1-128k and Claude-3.5-sonnet extraction accuracy was 95.12% and 96.2%; human-assisted Moonshot accuracy was 97.92%. Assisted time included generation, verification and modification (14.7 min extraction; 5.9 min RoB), but manual time and accuracy comparators came from historical literature rather than concurrent controls. High aggregate RoB accuracy coexisted with sensitivity 0.50 for selective reporting and 0.40 for other bias.
