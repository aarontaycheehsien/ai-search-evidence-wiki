notes: "Independent 800-result descriptive audit: four topics, ten tools, top twenty results each, October 2024/April 2025. Outcomes are authorship geography, gender and citation/journal composition, not relevance/recall. Authors group Semantic Scholar/ResearchRabbit with GenAI; do not infer these are generative systems. Table 2 conventional-tool total column disagrees with topic-cell sums for all five conventional rows; aggregate 115 agrees. Table 4 Google Scholar rank sum 16.4 versus displayed components 16.5. Preserve these discrepancies."
