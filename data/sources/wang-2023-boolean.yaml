id: wang-2023-boolean
type: conference-paper
title: "Can ChatGPT Write a Good Boolean Query for Systematic Review Literature Search?"
authors:
  - Shuai Wang
  - Harrisen Scells
  - Guido Zuccon
  - Bevan Koopman
year: 2023
doi: 10.1145/3539618.3591703
url: https://doi.org/10.1145/3539618.3591703
publication_status: "Published in the Proceedings of the 46th ACM SIGIR Conference on Research and Development in Information Retrieval; local file is the arXiv author manuscript"
source_category: peer-reviewed-study
local_file: "incoming/papers/Wang et al - 2023 - ChatGPT Boolean query generation.pdf"
notes: >
  Benchmarked ChatGPT prompt variants on CLEF TAR and seed-study collections
  using PubMed retrieval. Prompt-only queries often had higher precision but
  materially lower recall than human queries; guided seed-based construction
  improved recall. Generated MeSH terms were frequently invalid and repeated
  prompts were variable. The tested January 2023 ChatGPT snapshot and PubMed
  benchmarks limit generalization.
