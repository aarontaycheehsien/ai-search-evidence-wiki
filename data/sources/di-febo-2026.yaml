notes: >
  Compared ChatGPT-5, Elicit, Consensus, Scite, and PubMed on four cardiology
  topics, with blinded expert judgments of relevance and key references. The
  abstract identifies substantial tool-level variation, but reports ChatGPT-5
  rather than Consensus as the top performer. This is a narrow, single-domain
  evaluation at one product snapshot; do not infer a general ranking from it.
