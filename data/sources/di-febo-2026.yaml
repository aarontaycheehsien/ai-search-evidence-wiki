notes: >
  Compared ChatGPT-5, Elicit, Consensus, Scite, and PubMed on four cardiac
  resynchronization therapy topics. Methods, PDF p. 3 explicitly identifies
  Scite Assistant, configured to supplement its citation database with the
  open web. The authors report free web interfaces used during August 2025
  to January 2026, four prompts per AI tool/topic, one submission per prompt,
  and up to ten references per condition. Scite contributed 113 eligible
  retrieval records; three blinded experts assessed the pooled corpus.
  Methods, PDF p. 4 defines both primary metrics as precision-type measures
  over each tool's retrieved articles. Scite medians were 20% relevant articles
  (IQR 17-31%) and 10% expert-defined key references (IQR 0-20%); the latter
  is not exhaustive recall, despite looser retrieval wording in Results.
  No fabricated citations were found for any tool in the main analysis;
  minor correctable metadata discrepancies were permitted. Findings concern
  reference retrieval, not the factuality of Assistant's generated answers.
  Limitations include one CRT subdomain, no repeated identical prompts,
  a pooled reference standard partly supplied by evaluated tools, different
  corpora and intended purposes, and free tiers. Full text checked locally;
  the 2026-09-27 Undermind download was byte-identical to the existing PDF.
