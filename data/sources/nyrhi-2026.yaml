notes: >
  Preregistered validation of four LLMs against published human judgments for
  100 RoB 1 and 100 RoB 2 trial assessments. Agreement was fair for RoB 1 and
  poor for RoB 2, with low positive and negative predictive values and systematic
  over-flagging of concerns. The human reference judgments may themselves be
  imperfect, sampling was not random, and training-data contamination could not
  be excluded.
