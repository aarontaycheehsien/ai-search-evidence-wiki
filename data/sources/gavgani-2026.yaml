notes: >
  Abstract-only evidence in this workspace. The abstract reports expert
  assessment of the top 50 results per platform for one tissue-engineering
  topic: Consensus precision 86.0% with no false drops, compared with 75.5%
  and 72.0% for Semantic Scholar and Google Scholar. The public publisher
  page still required paid or subscriber access on 2026-09-27; no full-text
  PDF was obtained in this processing pass. Verify the full methods and
  results before relying on the estimate. The publisher's linked corrigendum,
  DOI 10.1108/IDD-08-2026-0302, corrects the funding attribution to Tabriz
  Health Services Management Research Center, Tabriz University of Medical
  Sciences. Its text does not report a correction to retrieval results.
