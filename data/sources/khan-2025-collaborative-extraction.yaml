  Ten prostate-cancer trials in 22 publications; 5 development and 17 held-out publications, 23 variables. Initial test-set concordance was 342/391 with 0.94 accuracy; 25/49 discordant responses became concordant after critique but accuracy in that subset was 0.76. GPT-4-turbo and Claude-3-Opus agreement did not guarantee correctness. Some trials had publications in both splits; a sensitivity analysis excluded overlapping trials. No measured end-to-end time comparison.
