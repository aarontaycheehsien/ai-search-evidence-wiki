notes: >
  The preprint combines retrospective model selection and external validation
  with prospective deployment across 24 reviews in two Swedish national
  guideline programmes. Person-days are estimated from assumed per-record
  screening times and exclude implementation overhead. The 600-record
  AI-excluded audit found no confirmed final false negatives after
  post-unblinding adjudication, but the reference standard incorporated AI
  output after unblinding and cannot rule out rare or review-specific misses.
