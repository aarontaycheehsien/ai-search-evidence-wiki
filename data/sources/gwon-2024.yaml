notes: >
  Full text read from Europe PMC JATS XML for PMC11107769, downloaded on
  2026-09-27. Public publisher and repository PDF routes failed; this local
  source is XML, not a PDF. The experiment used GPT-3.5 and Bing AI in Precise
  mode with one Peyronie-disease review containing 24 included RCTs as a
  benchmark. ChatGPT searches ran 17 April to 6 May 2023. Results report
  639 ChatGPT questions and 1,287 presented reference entries, versus 223
  Bing questions and 48 entries. Bibliographic grading and matching the
  benchmark are different endpoints: ChatGPT produced 7 grade-A and 18
  grade-B entries, but only 1 strict benchmark match and 4 matches under
  relaxed bibliographic criteria; Bing produced 19 grade-A entries but only
  2 benchmark matches. Generated entries must not be assumed to be unique
  retrieved studies. The Discussion states Bing did not generate fake studies,
  but Results separately describes one ungraded fake-title/database-attribution
  case; preserve that qualification. Different question counts, conversation
  flows, database labels, and access architectures limit fair tool comparisons.
  Findings concern these 2023 configurations and one topic, not current tools.
