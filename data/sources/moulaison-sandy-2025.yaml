notes: >
  Independent exploratory evaluation by researchers affiliated with the
  University of Missouri and University of Antioquia. Paid versions of Scite,
  Jenni.ai, OpenRead, and Wisio were piloted and demonstrated to the research
  team using a shared initial prompt for a 500-1000-word review of e-reading
  in English and Spanish, with interactive refinements and collaborative
  coding. Tables 1-2 report Scite output affordances and 10 references with no
  reference hallucinations reported. The paper refers only to Scite, not
  Scite Assistant, and does not identify its model/version or a repeated-run
  sample. PDF p. 7 explicitly leaves text accuracy and source relevance for
  future research. These observations do not establish Assistant answer
  accuracy, claim-source fidelity, retrieval completeness, or a general tool
  ranking. PDF downloaded through Undermind MCP on 2026-09-27; see the Scite
  search export, download manifest, and processing report in incoming/.
