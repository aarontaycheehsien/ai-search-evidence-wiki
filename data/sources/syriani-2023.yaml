notes: >
  Evaluates GPT-3.5 on five software-engineering review datasets from ReLiS.
  Tables 5-10 report dataset-specific results; Table 10 shows recall from
  0.327 to 0.947. Ten repeat runs were used for consistency analysis on two
  datasets; the other three datasets used one GPT run. The arXiv record
  identifies this as a 2023 preprint and lists a related journal article
  under a different title; this record describes the supplied preprint.
