local_file: "incoming/papers/Lagisz et al - 2026 - Elicit data extraction feasibility.pdf"
notes: >
  Evaluated extraction across seven life and environmental science reviews,
  using eight papers per review for prompt development and another eight for
  testing. Test accuracy was 86.6%; repeating extraction with different
  accounts yielded 90% agreement on values but only 46% quote and 30% reasoning
  matches. The high-accuracy mode's accuracy was 82.1%. The study reports that
  accuracy varied and was lower on test articles than during prompt
  development; time savings were not measured.
