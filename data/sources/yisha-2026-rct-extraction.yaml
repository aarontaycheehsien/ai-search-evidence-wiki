notes: >
  Compared ChatGPT-4 and Claude 3 Opus with verified gold-standard datasets for
  105 RCTs from two reviews. Binary-outcome group-size accuracy was 91%-94%,
  event-count accuracy 57%-71%; continuous-outcome group-size accuracy was
  59%-69%, while mean and standard-deviation accuracy ranged from 24%-56%.
  Supplementary files were excluded, prompting variants did not significantly
  change accuracy, and the sample was limited to two reviews.
