notes: >
  Compared five LLMs, combinations of LLMs, and human-LLM pairs with human
  consensus for PRISMA, AMSTAR, and PRECIS-2 ratings. Standalone LLMs performed
  below individual humans. Human-LLM agreement workflows improved accuracy for
  PRISMA and AMSTAR while deferring a minority of items, but PRECIS-2 required
  deferral for roughly three quarters of ratings. This is a preprint and the
  workload savings were modeled rather than prospectively measured.
