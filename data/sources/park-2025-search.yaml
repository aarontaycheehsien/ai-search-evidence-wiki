title: "Quality Evaluation of Generative AI-Based Search Strategies in Systematic Reviews and Comparison of Search Performance with Human Expert (Medical Librarian)"
authors:
  - Hye Won Park
  - Dong Won Shin
  - Na Jin Kim
year: 2025
