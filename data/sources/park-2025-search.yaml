url: https://doi.org/10.69528/jkmla.2025.52.1.28
publication_status: "Published in Journal of Korean Medical Library Association 52(1), 28-47"
source_category: peer-reviewed-study
local_file: "incoming/papers/Park et al - 2025 - Generative AI search strategy comparison.pdf"
notes: >
  Compared ChatGPT-5, Gemini 2.5, and an experienced medical librarian on one
  obesity-psychotherapy topic against 139 included studies across PubMed, Embase,
  and Cochrane Library. Sensitivity was 46.8%, 49.6%, and 54.7%, respectively;
  precision was below 1% in every arm. Results are single-topic and the librarian
  strategy itself missed included records.
