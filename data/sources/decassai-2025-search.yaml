publication_status: "Published in Regional Anesthesia & Pain Medicine 51(5), 554-557; issue published 2026"
source_category: peer-reviewed-study
notes: >
  Abstract-based record. Compared PubMed retrieval from ChatGPT-4o and a custom
  Meta-Analysis Librarian search string against original search strings for 85
  anesthesiology systematic reviews. The abstract reports median retrieval
  rates of 6% for ChatGPT-4o, 24% for the custom model, and 65% for original
  strategies. The comparison uses prior review retrieval/reference sets and
  one specialty; full-text methods and tables have not been independently
  checked for this wiki record.
