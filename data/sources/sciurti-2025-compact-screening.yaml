notes: >
  Full-text checked. Retrospective evaluation of GPT-4o mini, Llama 3.1 8B, and
  Gemma 2 9B across three reviews (1,757, 21,116, and 7,693 records), using
  prespecified rating thresholds and a majority-vote ensemble. Against
  full-text inclusions, majority voting achieved 100% sensitivity in all three
  reviews; workload saving at 100% sensitivity ranged from 12.5% to 88.5%.
  Positive predictive values remained low. Results are retrospective, and the
  small number of review datasets limits generalizability.
