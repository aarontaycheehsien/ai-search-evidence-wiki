notes: >
  Retrospective comparison with consensus screening decisions across six
  clinical reviews and 24,307 title/abstract records; 538 were included by
  the reference standard. The workflow used GPT and GPT-4 APIs depending on
  token length. Table 3 gives weighted overall accuracy 0.907, inclusion
  sensitivity 0.764, exclusion sensitivity 0.910, and macro F1 0.600.
