notes: >
  Prospective study within six ongoing reviews comparing Claude-first extraction
  checked by a human with conventional human-first extraction checked by a
  second human. Across 9,341 data items from 63 studies, the AI-assisted workflow
  had 91.0% accuracy versus 89.0% for human-only extraction and saved a median
  41 minutes per study. Both arms retained errors, and only discordant items were
  adjudicated, so shared errors could have been missed.
