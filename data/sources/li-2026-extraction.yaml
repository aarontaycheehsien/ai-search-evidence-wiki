title: "What level of automation is 'good enough'? A benchmark of large language models for meta-analysis data extraction"
authors:
  - Lingbo Li
  - Anuradha Mathrani
  - Teo Susnjak
year: 2026
doi: 10.1017/rsm.2025.10066
url: https://doi.org/10.1017/rsm.2025.10066
publication_status: "Published in Research Synthesis Methods"
source_category: peer-reviewed-study
local_file: "incoming/papers/Li et al - 2026 - Benchmark of LLMs for meta-analysis data extraction.pdf"
notes: >
  Benchmarked GPT-4o-mini, Gemini 2.0 Flash, and Grok 3 on 58 RCTs from six
  meta-analyses. Precision was generally high, but omissions dominated the
  22,196 catalogued error instances. Customized prompts increased recall by an
  average 14.8 percentage points with a small average precision decrease. The
  authors recommend task-specific automation with human verification rather
  than autonomous extraction, especially for statistical results.
