local_file: "incoming/papers/Wang et al - 2025 - Reassessing LLM Boolean Query Generation.pdf"
notes: >
  Reproducibility study of LLM-generated PubMed Boolean queries using CLEF TAR
  and seed-study benchmarks. Results varied materially by model, prompt,
  validation, and seed choice. Generated queries generally had higher precision
  but lower recall than expert manual queries; combining guided queries could
  approach manual recall while sharply reducing precision. The authors flag
  possible benchmark contamination and the post-hoc nature of best-seed choice.
