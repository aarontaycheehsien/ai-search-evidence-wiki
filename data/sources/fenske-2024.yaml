title: "Incorporating Generative AI to Promote Inquiry-Based Learning: Comparing Elicit AI Research Assistant to PubMed and CINAHL Complete"
authors:
  - Rachel F. Fenske
  - J. A. A. Otts
year: 2024
doi: 10.1080/02763869.2024.2403272
url: https://doi.org/10.1080/02763869.2024.2403272
publication_status: "Published in Medical Reference Services Quarterly"
source_category: peer-reviewed-study
local_file: "incoming/papers/Fenske and Otts - 2024 - Elicit vs PubMed and CINAHL.pdf"
notes: >
  Descriptive course-based comparison involving 323 graduate nursing students
  using a 2023 beta version of Elicit alongside PubMed and CINAHL. Tool
  preference was divided: 26.0% chose Elicit, 30.7% PubMed, and 31.6% CINAHL.
  Student reports included concerns about brief or inaccurate generated
  abstracts; this was not a blinded retrieval-accuracy benchmark.
