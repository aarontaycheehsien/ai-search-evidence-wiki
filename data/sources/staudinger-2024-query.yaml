notes: >
  Reproduced and extended Boolean-query generation experiments across CLEF TAR
  and seed collections. LLM recall remained well below expert-query recall and
  results varied across models and prompts; 15.8% of generated queries contained
  malformed parentheses. Small benchmark collections and stochastic outputs
  limit precision of model rankings.
