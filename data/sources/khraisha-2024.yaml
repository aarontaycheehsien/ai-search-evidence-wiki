local_file: "incoming/papers/Khraisha et al. - 2024 - Can large language models replace humans in system.pdf"
notes: >
  Preregistered study using the GPT-4 chat interface on 300 titles/abstracts,
  150 full texts, and extraction from 30 full texts in a refugee parenting
  review. Table 1 stratifies results by language, literature type, and stage.
  English peer-reviewed title/abstract data were deliberately balanced;
  other strata were not. The high-reliability prompt subgroup was also
  imbalanced, so prompt effects and prevalence cannot be cleanly separated.
