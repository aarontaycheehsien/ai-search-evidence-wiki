local_file: "incoming/papers/Tranfield and Caldwell - 2024 - Machine-driven research landscapes.pdf"
notes: >
  Preliminary comparison of six tools, including SciSpace and Elicit, across
  ten STEM subdisciplines using 50 top-ranked citations per tool and blinded
  abstract screening. The paper reports substantial overlap among SciSpace
  results and lower recent-item representation for Elicit. Relevance scoring
  was still ongoing, so these descriptive coverage results are not a complete
  accuracy evaluation.
