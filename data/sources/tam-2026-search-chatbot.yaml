publication_status: "Published in Journal of Nursing Scholarship 58(2), article e70076, 2026"
source_category: peer-reviewed-study
notes: >
  Abstract-based record. Cross-sectional evaluation of a custom ChatGPT-4
  chatbot generating PICO-informed PubMed and Embase searches, tested on 50
  Cochrane reviews and 1,169 included studies. The abstract reports median
  retrieval of 67.4% (IQR 43.1%-88.4%), or 72.0% among indexed studies; retrieval
  was lower when outcomes were absent from abstracts or interventions had many
  lexical variants. A repository lists a PDF, but direct download did not
  succeed in this session; no LibKey link was used.
