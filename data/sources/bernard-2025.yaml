notes: >
  Repeated an Elicit search three times for an umbrella-review question and
  compared included studies with a prior independent review. Full text reports
  246, 169, and 172 records across the three trials, with only 3 of 17 prior
  included reviews also found by Elicit and 3 additional eligible reviews.
  This is a single topic and an older Elicit version; retrieval counts varied.
