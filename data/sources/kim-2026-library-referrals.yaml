  Single-institution GA4 referral analysis at Drexel University Libraries, August 2023-October 2025. Of 9,753 AI-referred sessions, 7,303 reached the repository; 4,098 repository sessions reached theses/dissertations. Referral tracking may undercount app traffic and retain bot noise. Engagement metrics do not measure relevance, completeness, usability or user intent; release/traffic associations do not establish causation. The PDF reports differing aggregate and table user counts, so session counts are used for the claim.
