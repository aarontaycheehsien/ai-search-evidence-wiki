notes: >
  Evaluated Primo Research Assistant (PRA) against expert Boolean searches using
  natural-language queries from a Primo zero-results report. Across the
  analyzed queries, the abstract reports similar proportions of topic-relevant
  sources for PRA and conventional Primo (46.3% and 45.6%); it also reports
  limited title overlap and some overview-summary misrepresentation. Results
  are from one institution and a beta implementation.
