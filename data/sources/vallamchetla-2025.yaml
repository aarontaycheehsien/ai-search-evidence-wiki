notes: >
  Abstract-only extraction from PubMed PMID 40447171; the full paper was not
  available locally. Four neurology trainees independently screened the same
  1,003 records. One reviewer in each experience pair received LLM-generated
  PICOS summaries. The abstract reports screening times and sensitivity, but
  this small comparison cannot isolate the summaries from individual reviewer
  differences or establish generalizable time savings.
