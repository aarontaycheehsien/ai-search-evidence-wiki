notes: >
  Compared 2,169 AI-generated clinical reviews with 62 reviews from four
  leading medical journals. Reference accuracy was the percentage of cited
  references whose explanation in a review was manually judged consistent
  with the original article. The pooled AI median was 100% (IQR 73.55-100%)
  versus 100% (IQR 100-100%) for human reviews; standalone LLMs had a median
  of 95% (IQR 51.22-100%). Results varied substantially across systems and
  generation workflows, and the study did not cover all clinical fields.
