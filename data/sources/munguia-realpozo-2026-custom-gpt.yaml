notes: >
  In a data-extraction arm nested within a registered review, a customized
  GPT-4o extracted fields from 15 SLE metabolomics studies. Overall template
  concordance with human consensus was 25%; country extraction matched for
  15/15 studies, while age and sex-distribution fields matched for 0/15.
  Mean model extraction time was 5.7 minutes per study versus 30.4 minutes for
  human reviewers. The sample was small and disease-specific; table and
  supplementary information were frequent failure points. This paper also
  contains a separate risk-of-bias arm that is outside the extraction results
  recorded here.
