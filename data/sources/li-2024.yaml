notes: >
  Evaluates ChatGPT v4.0, ChatGPT v3.5, Google PaLM, and Meta Llama 2 on
  selected abstracts from three SYNERGY datasets. This record now describes
  the published journal version, which expands the supplied Research Square
  preprint with additional model and method analyses. The selected case/control
  proportions differ from the original datasets. The journal abstract says
  ChatGPT v4.0 accuracy consistently reached or exceeded 90%, but Table 3
  reports 0.848 accuracy for Meijboom 2021. Claim records use table values.
