notes: >
  Evaluates ChatGPT v4.0, ChatGPT v3.5, Google PaLM, and Meta Llama 2 on
  selected abstracts from three SYNERGY datasets. The selected case/control
  proportions differ from the original datasets. The abstract says ChatGPT
  v4.0 accuracy consistently reached or exceeded 90%, but Table 3 reports
  0.848 accuracy for Meijboom 2021. Claim records use the table values.
