id: assistant-011
claim: >
  A March 2025 case study of Polish public-university libraries found limited
  adoption of Primo Research Assistant despite technical availability;
  non-adopters reported functional limitations and gaps in awareness of
  implementation capabilities.
status: provisional
topics:
  - primo-research-assistant
evidence:
  - source_id: kotula-2026
    relationship: supports
    locator: "Purpose of the Study and Methods, PDF pp. 2-3; non-adopter results and Discussion, pp. 11-13"
    note: >
      The authors identified 19 Primo VE libraries among 65 Polish
      public-university libraries, of which nine had enabled the beta assistant.
      They report six adopter and eight non-adopter survey responses, with
      surveys open March 25-31, 2025. Six of eight non-adopters intended to
      implement it; two had not considered it. Reported reasons for non-adoption
      included poor functionality, unsatisfactory humanities results, and
      awaiting a better version. Two respondents mistakenly believed they lacked
      the necessary discovery infrastructure. These are institutional reports,
      not verified performance failures or causal estimates of adoption barriers;
      the small sample limits generalization beyond this setting and period.
last_reviewed: 2026-09-27
