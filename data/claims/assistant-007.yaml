id: assistant-007
claim: >
  AI search and extraction tools can reduce initial search or screening effort,
  but measured efficiency gains may coincide with lower retrieval sensitivity
  or be offset by prompt development, screening, and human verification.
status: provisional
topics:
  - research-assistant-tools
evidence:
  - source_id: featherstone-2025
    relationship: supports
    locator: "Tables 2-5, PDF pp. 7-12; focus-group findings, PDF pp. 13-15"
    note: "The tested tools required less search execution and modeled screening time than customary practice, but average sensitivity across six review projects was 0.230-0.676 versus 0.986 for the reference searches."
  - source_id: vyas-2026
    relationship: qualifies
    locator: "Discussion, PDF p. 2"
    note: "Raw extraction was faster, but the authors reported that custom-column setup and cross-validation could lead researchers to spend more time obtaining correct data. This was not a formal timing comparison."
  - source_id: lagisz-2026
    relationship: contextual
    locator: "Methods and Results, PDF pp. 4-12"
    note: "Forty of 70 successful extraction variables required two to four prompt iterations, and 20 of 90 variables failed to reach the development threshold after five iterations; manual-versus-AI time was not measured."
last_reviewed: 2026-09-26
