id: assistant-037
claim: >
  An exploratory study found favourable literature-review output features
  for paid Scite on one English/Spanish e-reading topic, without establishing
  Scite Assistant's factual accuracy or source relevance.
status: provisional
topics:
  - scite
evidence:
  - source_id: moulaison-sandy-2025
    relationship: supports
    locator: "Method, PDF pp. 4-5 (1247-1248); Tables 1-2, p. 5 (1248); observations, p. 6; limitations, p. 7"
    note: >
      Four paid tools (Scite, Jenni.ai, OpenRead, Wisio) were piloted and then
      demonstrated with a shared initial 500-1000-word literature-review prompt,
      interactively refined, and collaboratively coded. Scite produced more
      than 500 words, permitted date selection and methodology summaries, and
      supplied ten primary-source references, links, APA formatting, and an
      export with references. It could not restrict sources to peer-reviewed
      items or by language, although output could be generated in Spanish.
      Table 2 marks no reference hallucinations for any of the four systems.
      The paper calls the product Scite and does not identify Assistant by
      name, a model/version, testing date, or repeated-run count. It explicitly
      reserves text accuracy and source relevance for future work. The positive
      affordance findings are not an answer-accuracy or completeness benchmark.
last_reviewed: 2026-09-27
