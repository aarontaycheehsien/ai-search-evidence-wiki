id: screening-004
claim: >
  Changing the information supplied to an LLM or the decision rule used
  to interpret its output can alter screening performance.
status: supported
topics:
  - llm-screening
evidence:
  - source_id: alshami-2023
    relationship: supports
    locator: "Section 3.2 and Figure 9, PDF pp. 17-20"
    note: "On a 120-record subset, adding abstracts to APA metadata raised the 'not related' class F1 from 81% to 90% and recall from 80% to 93%."
  - source_id: tran-2024
    relationship: supports
    locator: "Table 2, PDF p. 7"
    note: "The sensitive rule raised sensitivity to 94.6%-99.8% while specificity fell to 2.2%-46.6%, compared with 81.1%-96.5% sensitivity and 25.8%-80.4% specificity under the balanced rule."
  - source_id: li-2024
    relationship: contextual
    locator: "Tables 2-4, journal PDF pp. 9, 11-12"
    note: "Published journal version: majority voting changed sensitivity and specificity compared with individual models, in different directions by dataset."
  - source_id: khraisha-2024
    relationship: qualifies
    locator: "Methods and Table 1, PDF pp. 3-4, 7"
    note: "Prompt reliability differed by criterion, but the high-reliability subgroup was also imbalanced; its result cannot isolate a prompt effect."
  - source_id: cao-2025
    relationship: supports
    locator: "PubMed abstract, Results (PMID 39993313)"
    note: "Abstract-only evidence: optimized prompts had 97.7% weighted sensitivity in abstract screening across ten reviews versus 49.0% for zero-shot prompts."
  - source_id: nykvist-2025
    relationship: supports
    locator: "Table 1, PDF p. 3"
    note: "In one environmental review, GPT-4 recall was 1.00 at cutoff 0.5 and 0.96 at cutoff 0.8, while work saved over sampling rose from 0.55 to 0.75."
  - source_id: sanghera-2025
    relationship: supports
    locator: "Table 4, PDF p. 9"
    note: "Across 119,695 records, parallel ensemble rules with sensitivity 1.000 had calculated workload reductions of 37.55%-41.81%; series rules saved more screening but had lower sensitivity."
  - source_id: colangelo-2025-screening
    relationship: supports
    locator: "Results sections 3.4-3.6 and Figures 6-8, PDF pp. 13-16"
    note: "In the most similar periodontal quartile, changing verbose to concise prompts reduced GPT-4o precision from 90% to 75% and Claude 3 Haiku precision from 16.1% to 11.5%. Two-stage prompts did not rescue weaker models."
last_reviewed: 2026-09-26
