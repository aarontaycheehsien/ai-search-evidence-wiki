id: assistant-038
claim: >
  Scite Assistant returned locatable citations despite low topical relevance
  in one cardiology test; citation existence and retrieval relevance are
  different properties.
status: supported
topics:
  - scite
evidence:
  - source_id: di-febo-2026
    relationship: supports
    locator: "Citation definitions, PDF pp. 3-4; relevance results, p. 6; citation accuracy results, p. 8"
    note: >
      No fabricated, untraceable citations occurred in the main analysis for
      any tool, including Scite Assistant, when up to ten references were
      examined per condition. Minor metadata errors were corrected when the
      underlying article could be located. This coexisted with Scite's 20%
      median relevance. Absence of untraceable references therefore does not
      establish topical relevance, error-free metadata, or correct support for
      generated claims. The long-list ChatGPT-only subanalysis does not
      estimate Scite's fabrication rate with longer lists.
  - source_id: moulaison-sandy-2025
    relationship: contextual
    locator: "Table 2, PDF p. 5 (1248); limitations, p. 7 (1250)"
    note: >
      Table 2 records ten references and no reference hallucinations for the
      evaluated Scite review output, but the authors explicitly defer text
      accuracy and source relevance testing. The product is labelled Scite,
      with no Assistant feature or model identified. This narrow observation
      does not establish a zero general hallucination rate or claim-source
      fidelity.
last_reviewed: 2026-09-27
