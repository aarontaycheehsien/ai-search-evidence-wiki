id: assistant-003
claim: >
  One single-domain study reported high Consensus precision on a specialized
  tissue-engineering query, while broader comparative studies do not support
  treating that result as a stable cross-domain performance estimate.
status: provisional
topics:
  - research-assistant-tools
evidence:
  - source_id: gavgani-2026
    relationship: supports
    locator: "Abstract only; full text not obtained"
    note: "The abstract reports 86.0% precision and no false drops for the top 50 Consensus results in one tissue-engineering evaluation."
  - source_id: krump-2026
    relationship: contextual
    locator: "medRxiv abstract only"
    note: "The abstract reports no significant between-tool differences in critical or non-critical concept coverage for 12 generated clinical questions (p=.95 and p=.16), including Consensus, Elicit, SciSpace, and Undermind. This is an unreviewed preprint and the full text was not obtained."
  - source_id: di-febo-2026
    relationship: contextual
    locator: "Abstract, p. 1; Results, PDF pp. 6–8"
    note: "In four cardiology topics, ChatGPT-5 ranked highest for relevant articles and key references, while Scite ranked lowest. Consensus was included, but the available abstract does not disclose its product-specific point estimate."
