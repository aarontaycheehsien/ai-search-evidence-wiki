id: extraction-006
claim: >
  Agreement between extraction models can identify a more accurate subset of outputs, but neither initial agreement nor agreement reached through cross-critique guarantees correctness.
status: supported
topics:
  - llm-data-extraction
evidence:
  - source_id: khan-2025-collaborative-extraction
    relationship: supports
    locator: "Results, PDF pp. 4-6; Figure 3, p. 6"
    note: "In 17 held-out publications, 342/391 initial concordant outputs were 94% accurate. Cross-critique made 25/49 discordant outputs concordant, but accuracy in this new-consensus subset was 76%. These are conditional subset accuracies, not an overall 94% accuracy estimate for all outputs."
last_reviewed: 2026-09-26
