id: assistant-036
claim: >
  In a four-topic cardiology comparison, Scite Assistant had the lowest median
  proportions of relevant and expert-defined key references among retrieved
  articles; these precision measures do not estimate exhaustive recall.
status: supported
topics:
  - scite
evidence:
  - source_id: di-febo-2026
    relationship: supports
    locator: "Methods and metric definitions, PDF pp. 3-4; Results and Table 2, pp. 5-6; Figure 4, p. 7; limitations, p. 9"
    note: >
      Free-tier Scite Assistant supplemented its citation database with the
      open web. Four prompts across four CRT topics were each submitted once,
      collecting up to ten ranked references per condition (113 eligible Scite
      retrieval records). Three blinded experts rated a pooled tool/SLR corpus;
      mean relevance above 2.5 on a 0-3 scale defined clinically relevant items.
      Scite medians were 20% relevant articles (IQR 17-31%) and 10% key references
      (IQR 0-20%); ChatGPT-5 medians were 90% and 60%. Methods explicitly divides
      both metrics by retrieved articles. The 10% is not the proportion of all
      key references recovered. One subdomain, free tiers, one run per prompt,
      corpus incorporation, and different intended tool functions limit
      generalization. Generated-answer factuality was not measured.
last_reviewed: 2026-09-27
