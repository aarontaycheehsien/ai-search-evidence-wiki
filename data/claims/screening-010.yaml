id: screening-010
claim: >
  In one umbrella-review workflow study, Elicit screening on a shared
  324-record corpus recovered most traditionally included studies but selected
  many additional records that reviewers judged ineligible.
status: provisional
topics:
  - llm-screening
evidence:
  - source_id: mazzali-2026
    relationship: supports
    locator: "Results, PDF p. 7 (title/abstract stage) and p. 8 (full-text stage); abstract, p. 1"
    note: "At title/abstract screening, Elicit selected 70 records versus 33 traditionally, with 30 overlapping (recall 90.9%, 95% CI 75.7–98.1; precision 42.9%, 95% CI 31.1–55.3). Full-text selection had recall 100% and precision 62.5%. This comparison applies Elicit functions to the same 324 records; the separate natural-language retrieval set overlapped the traditional search by only 8%, so this does not establish end-to-end search recall."
last_reviewed: 2026-09-25
