id: extraction-003
claim: >
  LLM extraction performance varies by field and structural complexity:
  explicit study descriptors are generally easier than numerical outcomes,
  relational bindings, and complete synthesis-ready records.
status: supported
topics:
  - llm-data-extraction
evidence:
  - source_id: oami-2026-extraction
    relationship: supports
    locator: "Table 2 and Figure 1, PDF pp. 3-5"
    note: "Across three models, background-data no-error proportions ranged from 81.6%-92.4%, while outcome-data no-error proportions ranged from 27.8%-80.7%."
  - source_id: yisha-2026-rct-extraction
    relationship: supports
    locator: "Results and Figures 2-6, PDF pp. 3-8"
    note: "Binary group-size accuracy was 91%-94%, compared with 24%-56% for continuous-outcome means and standard deviations."
  - source_id: tan-2026-structural
    relationship: supports
    locator: "Table 6, PDF p. 10; error analysis, PDF pp. 11-12"
    note: "Across 52 empirical papers, single-attribute F1 was higher than multi-attribute binding; both models scored F1=0 on the complete association tuple."
  - source_id: achterberg-2026-openextract
    relationship: supports
    locator: "Tables 1-2, PDF p. 4"
    note: "In a 10-paper digital-health review sample, aggregate precision and recall varied by model size: 0.820/0.820 and 0.846/0.813 for the two larger models versus 0.624/0.564 for the 7B model."
  - source_id: munguia-realpozo-2026-custom-gpt
    relationship: supports
    locator: "Results and Table 1, PDF p. 5"
    note: "In 15 SLE metabolomics studies, concordance was 100% for country, 26.7% for sample-size and analytical-platform fields, and 0% for age and sex-distribution fields."
  - source_id: azaad-2026-meta-analysis-coding
    relationship: supports
    locator: "Results, PDF pp. 4-5; Figures 1-2, PDF pp. 5-6"
    note: "GPT-5 and Gemini 2.5 Pro achieved 93% and 92% agreement with published codes for study properties across three psychology meta-analyses, including higher-level conceptual dimensions."
  - source_id: wang-2025-leads
    relationship: qualifies
    locator: "Figure 4, PDF p. 7; Results, Figure 5, PDF pp. 8-9"
    note: "LEADS benchmark and workflow evaluations varied by field: manual-evaluation accuracy was 84.0% for participant-statistic text but 56.7% for numeric trial results; the small expert-plus-AI pilot reached 0.85 accuracy for its extraction task."
  - source_id: vivekanantha-2026-dual-extraction
    relationship: supports
    locator: "Results, PDF pp. 4-6; Tables 1-3, PDF pp. 5-8"
    note: "Across eight orthopaedic studies, study-characteristic fields were both-model correct on 100% of fields, while secondary surgery details were both-model correct on 68.8%; at least one model was fully correct on 95.1% of all fields."
  - source_id: halpern-2026-agricultural-extraction
    relationship: qualifies
    locator: "Tables 4-9, PDF pp. 12-19; limitations, PDF pp. 26-27"
    note: "This bioRxiv preprint reports pooled-effect equivalence across five agricultural datasets but depends on LLM-based record alignment and does not formally validate variance extraction; it is a qualified counterexample for aggregated effect estimates, not evidence of uniform item-level accuracy."
