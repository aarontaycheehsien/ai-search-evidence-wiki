id: assistant-039
claim: >
  In one 2023 Peyronie-disease literature-search experiment, GPT-3.5 and
  Bing AI matched few trials from a completed review's 24 included RCTs;
  references graded as relevant were not necessarily benchmark matches.
status: provisional
topics:
  - general-purpose-ai-assistants
evidence:
  - source_id: gwon-2024
    relationship: supports
    locator: "Methods: Quality Assessment of Answers and Searching Strategy for Bing AI; Results: Systematic Search Results via ChatGPT/Bing AI; Tables 1-2 (full-text JATS XML, PMC11107769)"
    note: >
      ChatGPT produced 1,287 reference entries from 639 questions, including
      7 grade-A and 18 grade-B entries. Results report 1 strict match to the
      benchmark and 4 matches under relaxed criteria. Bing produced 48 entries
      from 223 questions, including 19 grade-A entries but only 2 benchmark
      matches. These output-quality and benchmark-match denominators differ;
      19 grade-A references does not mean Bing recovered 19 of 24 benchmark
      trials. GPT-3.5, Bing Precise mode, unequal question counts, different
      conversation flows and one topic constrain generalization.
last_reviewed: 2026-09-27
