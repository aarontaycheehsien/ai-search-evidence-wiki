id: screening-003
claim: >
  Several evaluated LLM screening workflows missed eligible citations
  under their reference standards, so automatic exclusion can omit studies.
status: supported
topics:
  - llm-screening
evidence:
  - source_id: guo-2024
    relationship: supports
    locator: "Table 3 and Discussion, PDF pp. 5, 7-8"
    note: "Inclusion sensitivity was 0.764 overall; the authors caution that relevant papers may be omitted."
  - source_id: khraisha-2024
    relationship: supports
    locator: "Table 1, PDF p. 7"
    note: "GPT-4 title/abstract sensitivity was 0.42-0.50 across the reported literature strata."
  - source_id: li-2024
    relationship: supports
    locator: "Tables 2-4, journal PDF pp. 9, 11-12"
    note: "Published journal version: ChatGPT v4.0 sensitivity was below 1.0 on each of the three selected datasets."
  - source_id: syriani-2023
    relationship: supports
    locator: "Table 10, PDF p. 19"
    note: "GPT-3.5 recall was 0.327 on MobileMDE and below 1.0 on all five reported datasets."
  - source_id: tran-2024
    relationship: supports
    locator: "Table 3, PDF p. 8"
    note: "With the sensitivity-optimized trimming rule, full-text inclusions missed were 1/26, 0/8, 1/200, 0/29, and 11/445 across the five reviews. This table conflicts with the paper's smaller abstract summary."
  - source_id: wilkins-2023
    relationship: supports
    locator: "Results, PDF p. 7"
    note: "Preprint: 71% weighted sensitivity across 1,147 records in six scoping reviews."
  - source_id: sanghera-2025
    relationship: supports
    locator: "Table 3, PDF p. 7"
    note: "Four of five selected model-prompt combinations had sensitivity below 1.0 on the comprehensive 119,695-record dataset."
  - source_id: homiar-2025
    relationship: contextual
    locator: "Table 3, PDF p. 4"
    note: "This single living-review evaluation retained all final full-text inclusions, while title/abstract sensitivity fell to 0.58 in one update; the reference-standard stage changes the interpretation."
last_reviewed: 2026-09-25
